name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check web UI JavaScript syntax
        run: for f in $(find openfan_service/web -name '*.js'); do node --check "$f"; done
