name: Docker image

# Builds one multi-arch image (linux/amd64 + linux/arm64) and pushes it to GitHub Container
# Registry on every push to master (or release), or when started by hand. Each build is a new version:
#   ghcr.io/<owner>/openfan-service:latest, :<yyyy-mm-dd> and :<yyyy-mm-dd>-<git hash>
# "docker pull ...:latest" automatically picks the amd64 or arm64 variant for the machine.
on:
  push:
    branches: ["master", "release"]
    paths: ['docker/**', 'openfan_service/**', 'Dockerfile']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests before publishing
        run: pip install -r requirements-dev.txt && python -m pytest
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version = build date (UTC) + git short hash, e.g. 2026-11-13 / a1b2c3d.
      # Shown in the web UI footer as "v2026-11-13 [a1b2c3d]".
      - name: Compute version
        id: version
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release' }}
            type=raw,value=${{ steps.version.outputs.date }}
            type=raw,value=${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OPENFAN_VERSION=${{ steps.version.outputs.date }}
            OPENFAN_GIT_HASH=${{ steps.version.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
